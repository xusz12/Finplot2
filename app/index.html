<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finplot</title><style>
#folio-finance{--f-bg:light-dark(#f5f5f7,#161618);--f-panel:light-dark(#fff,#222225);--f-ink:light-dark(#1d1d1f,#f5f5f7);--f-muted:light-dark(#75757c,#a5a5ae);--f-line:light-dark(#eaeaec,#363639);--f-side:light-dark(#eeeef1,#1d1d20);--f-blue:#007aff;--f-income:light-dark(#b34436,#ff9b8c);--f-expense:light-dark(#24734f,#6ad39c);--f-soft:light-dark(#e5efff,#243951);--f-green:light-dark(#258454,#6ad39c);--f-track:light-dark(#ededf0,#39393d);color:var(--f-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:var(--f-bg);border-radius:20px;overflow:hidden;min-height:820px;font-weight:400}
#folio-finance *{box-sizing:border-box}#folio-finance button{font:inherit;color:inherit;cursor:pointer}#folio-finance button:focus-visible{outline:3px solid var(--f-blue);outline-offset:3px}#folio-finance .f-shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:820px}#folio-finance .f-sidebar{background:var(--f-side);padding:30px 14px;display:flex;flex-direction:column;border-right:1px solid var(--f-line)}#folio-finance .f-logo{font-size:23px;font-weight:600;letter-spacing:-1px;display:flex;align-items:center;gap:9px;padding:0 10px 36px}#folio-finance .f-logo i{color:var(--f-blue)}#folio-finance .f-navlabel{font-size:11px;color:var(--f-muted);padding:0 12px 9px;letter-spacing:1.4px}#folio-finance .f-nav{display:flex;flex-direction:column;gap:5px}#folio-finance .f-nav button{border:0;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;border-radius:10px;font-size:13px}#folio-finance .f-nav button[aria-pressed=true]{background:var(--f-panel);box-shadow:0 2px 6px #00000005;color:var(--f-blue);font-weight:500}#folio-finance svg.lucide{width:18px;height:18px;stroke-width:1.7}#folio-finance .f-sidebottom{margin-top:auto;padding:24px 10px 0;color:var(--f-muted);font-size:11px}#folio-finance .f-profile{display:flex;align-items:center;gap:10px;padding-bottom:18px;margin-bottom:15px;border-bottom:1px solid var(--f-line);color:var(--f-ink);font-size:12px}#folio-finance .f-avatar{height:32px;width:32px;border-radius:50%;background:var(--f-panel);display:grid;place-items:center;font-weight:500}#folio-finance .f-main{padding:0 30px 26px;min-width:0}#folio-finance .f-top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--f-line);font-size:11px;color:var(--f-muted)}#folio-finance .f-topright{display:flex;align-items:center;gap:13px}#folio-finance .f-iconbtn{border:0;background:transparent;display:flex;padding:5px;color:var(--f-muted)}#folio-finance .f-dot{height:5px;width:5px;border-radius:50%;background:var(--f-green);display:inline-block;margin-right:6px}#folio-finance .f-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:27px 0 23px}#folio-finance h1{font-size:27px;line-height:1.25;letter-spacing:-1px;margin:0 0 7px;font-weight:600}#folio-finance .f-sub{color:var(--f-muted);font-size:12px}#folio-finance .f-segment{padding:3px;background:var(--f-track);border-radius:9px;display:flex;flex-shrink:0;gap:2px}#folio-finance .f-segment button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:11px;color:var(--f-muted)}#folio-finance .f-segment button[aria-pressed=true]{background:var(--f-panel);color:var(--f-ink);box-shadow:0 1px 4px #00000012}#folio-finance .f-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:18px}#folio-finance .f-stat{background:var(--f-panel);border-radius:16px;padding:19px 19px 17px}#folio-finance .f-label{font-size:11px;color:var(--f-muted);display:flex;align-items:center;gap:6px}#folio-finance .f-num{font-size:27px;line-height:1.25;letter-spacing:-.8px;font-weight:500;font-variant-numeric:tabular-nums;margin:10px 0 8px;white-space:nowrap}#folio-finance .f-num small{font-size:15px;margin-right:4px;font-weight:400;color:var(--f-muted)}#folio-finance .f-caption{font-size:10px;color:var(--f-muted)}#folio-finance .f-positive{color:var(--f-green)}#folio-finance .f-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:18px}#folio-finance .f-panel{background:var(--f-panel);border-radius:16px;padding:21px;min-width:0}#folio-finance .f-panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}#folio-finance h2{font-size:14px;font-weight:500;margin:0}#folio-finance .f-link{border:0;background:transparent;color:var(--f-blue);font-size:11px;padding:3px 0;display:flex;align-items:center;gap:2px}#folio-finance .f-income{color:var(--f-income)}#folio-finance .f-expense{color:var(--f-expense)}#folio-finance .f-legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--f-ink);font-size:12px}#folio-finance .f-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}#folio-finance .f-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:currentColor;flex-shrink:0}#folio-finance .f-swatch.f-expense,#folio-finance .f-fill.f-expense{background:repeating-linear-gradient(135deg,transparent 0 4.5px,var(--f-panel) 4.5px 6px),var(--f-expense)}#folio-finance .f-fill.f-income{background:var(--f-income)}#folio-finance .f-balance-state{font-size:11px;font-weight:500}#folio-finance .f-panelhead{flex-wrap:wrap}#folio-finance .f-chart{width:100%;display:block;overflow:visible}#folio-finance .f-chart text{fill:var(--f-muted);font-family:inherit;font-size:11px}#folio-finance .f-chart .f-gridline{stroke:var(--f-line);stroke-width:1}#folio-finance .f-insight{border-top:1px solid var(--f-line);padding-top:14px;margin-top:12px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--f-muted)}#folio-finance .f-insight i{color:var(--f-blue);flex-shrink:0}#folio-finance .f-rank{margin:18px 0}#folio-finance .f-rankline{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;gap:8px}#folio-finance .f-rankline b{font-weight:500;font-variant-numeric:tabular-nums}#folio-finance .f-track{height:6px;border-radius:5px;background:var(--f-track);overflow:hidden}#folio-finance .f-fill{height:100%;border-radius:5px;background:var(--f-blue)}#folio-finance .f-rank button{display:block;text-align:left;border:0;background:transparent;width:100%;padding:0}#folio-finance .f-bottom{margin-top:18px}#folio-finance .f-table{width:100%;border-collapse:collapse;font-size:11px}#folio-finance .f-table th{font-weight:400;color:var(--f-muted);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--f-line)}#folio-finance .f-table td{padding:13px 0;border-bottom:1px solid var(--f-line)}#folio-finance .f-table tr:last-child td{border-bottom:0;padding-bottom:0}#folio-finance .f-table th:last-child,#folio-finance .f-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}#folio-finance .f-merchant{display:flex;gap:10px;align-items:center}#folio-finance .f-merchanticon{display:grid;place-items:center;background:var(--f-bg);height:30px;width:30px;border-radius:9px;color:var(--f-muted);font-size:15px;flex:0 0 30px;font-family:inherit}#folio-finance .f-category-icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#folio-finance .f-merchanticon{display:grid;place-items:center;background:var(--f-bg);height:30px;width:30px;border-radius:9px;color:var(--f-muted)}#folio-finance .f-merchant small{display:block;color:var(--f-muted);font-size:10px;margin-top:2px}#folio-finance .f-footer{display:flex;justify-content:space-between;color:var(--f-muted);font-size:10px;padding-top:18px}#folio-finance .f-bigvalue{font-size:35px;font-weight:500;letter-spacing:-1px;margin:2px 0 4px}#folio-finance .f-stack{display:flex;height:15px;border-radius:5px;overflow:hidden;gap:3px;margin:22px 0}#folio-finance .f-stack span{background:var(--f-blue)}#folio-finance .f-note{padding:14px;border-radius:10px;background:var(--f-bg);font-size:11px;color:var(--f-muted);margin-top:19px}#folio-finance .f-note strong{display:block;color:var(--f-ink);font-weight:500;margin-bottom:5px}#folio-finance .f-drawer{margin-top:18px;border:1px solid var(--f-line);border-radius:12px;padding:15px;background:var(--f-bg)}#folio-finance [hidden]{display:none!important}#folio-finance .f-compact .f-panel{padding:16px}#folio-finance .f-compact .f-stat{padding:15px}
@media(min-width:1200px){#folio-finance .f-main{padding-left:44px;padding-right:44px}#folio-finance .f-num{font-size:32px}}
@media(max-width:850px){#folio-finance .f-shell{grid-template-columns:145px minmax(0,1fr)}#folio-finance .f-sidebar{padding:27px 9px}#folio-finance .f-main{padding:0 20px 24px}#folio-finance .f-num{font-size:23px}#folio-finance .f-grid{grid-template-columns:minmax(0,1fr)}#folio-finance .f-stats{gap:9px}#folio-finance .f-stat{padding:16px 12px}#folio-finance .f-heading{align-items:flex-start}#folio-finance .f-ranks{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}}
@media(max-width:560px){#folio-finance .f-chart text{font-size:20px}#folio-finance{border-radius:12px}#folio-finance .f-shell{display:block}#folio-finance .f-sidebar{padding:16px 15px 10px;border:0;border-bottom:1px solid var(--f-line)}#folio-finance .f-logo{padding:0 0 13px;font-size:20px}#folio-finance .f-nav{flex-direction:row;gap:3px}#folio-finance .f-nav button{padding:9px 10px;font-size:11px;gap:6px;flex:1;justify-content:center}#folio-finance .f-navlabel,#folio-finance .f-sidebottom{display:none}#folio-finance .f-main{padding:0 15px 20px}#folio-finance .f-top{height:44px}#folio-finance .f-topright>span{display:none}#folio-finance .f-heading{padding:22px 0 18px;flex-wrap:wrap}#folio-finance h1{font-size:25px}#folio-finance .f-stats{grid-template-columns:1fr 1fr}#folio-finance .f-stat:first-child{grid-column:1/-1}#folio-finance .f-stat:first-child .f-num{font-size:33px}#folio-finance .f-stat{padding:16px}#folio-finance .f-num{font-size:22px}#folio-finance .f-panel{padding:17px}#folio-finance .f-ranks{display:block}#folio-finance .f-accountcol{display:none}#folio-finance .f-caption{font-size:11px}#folio-finance .f-footer{gap:10px}}
</style><style>body{margin:0;background:#f5f5f7}select,input{font:inherit;max-width:100%;padding:7px;border:1px solid #ddd;border-radius:7px;background:white}#folio-finance .f-num{font-size:clamp(20px,2.3vw,32px);white-space:normal;overflow-wrap:anywhere}#folio-finance .f-table{table-layout:fixed}td{overflow-wrap:anywhere}#folio-finance .f-sub{line-height:1.7}button{min-height:34px}[data-close],.f-panelhead>button{border:0;border-radius:8px;background:#eeeef1;padding:7px 12px}#folio-finance select:focus-visible,#folio-finance input:focus-visible{outline:3px solid #007aff;outline-offset:3px}#folio-finance .f-rankline{flex-wrap:wrap}#folio-finance .f-heading{flex-wrap:wrap}</style><div id="folio-finance"><div class="f-shell"><aside class="f-sidebar"><div class="f-logo">Finplot</div><div class="f-navlabel">个人财务</div><nav class="f-nav"><button data-page="overview">财务总览</button><button data-page="analysis">收支分析</button><button data-page="invest">投资记录</button><button data-page="transactions">全部交易</button></nav></aside><main class="f-main"><div class="f-top"><span id="crumb">财务总览</span></div><div class="f-heading"><div><h1 id="title">让财务，清晰一点。</h1><div id="subtitle" class="f-sub"></div></div><div><label>月份 <input id="month" type="month"></label><div class="f-segment"><button data-period="month">所选月</button><button data-period="year">所选年</button></div></div></div><div id="content" aria-live="polite" style="margin-top:18px">正在读取账本…</div><footer class="f-footer">Finplot · 本地只读账本</footer></main></div></div><script src="/app.js"></script></html>
