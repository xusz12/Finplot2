<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finplot · 财务总览</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:44px 24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e7;padding-bottom:20px}.brand{font-size:22px;font-weight:650}.muted{color:#77777f;font-size:13px}.hero{padding:38px 0 24px}.hero h1{font-size:32px;margin:0 0 8px;letter-spacing:-1px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel{background:#fff;border-radius:16px;padding:22px}.label{font-size:13px;color:#77777f}.num{font-size:28px;margin:12px 0 6px;font-variant-numeric:tabular-nums}.negative{color:#b44d4d}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.panel h2{font-size:16px;font-weight:550;margin:0 0 20px}.bar{display:flex;align-items:center;gap:12px;margin:15px 0}.bar span:first-child{width:75px;font-size:13px}.track{height:8px;background:#ececf0;border-radius:8px;flex:1;overflow:hidden}.fill{height:100%;background:#007aff;border-radius:8px}.amount{font-variant-numeric:tabular-nums;font-size:13px}.tx{display:flex;justify-content:space-between;border-top:1px solid #eeeef1;padding:13px 0;font-size:13px}.tx small{display:block;color:#888;margin-top:4px}.income{color:#258454}@media(max-width:700px){main{padding:24px 16px}.cards,.grid{grid-template-columns:1fr}.cards .card:first-child{grid-column:auto}.hero h1{font-size:27px}}</style></head><body><main><div class="top"><div class="brand">Finplot</div><div class="muted">真实账本 · 2026 年 9 月</div></div><section class="hero"><h1>让财务，清晰一点。</h1><div class="muted">数据来自本地只读账本，金额按整数分聚合。</div></section><section id="cards" class="cards"></section><section class="grid"><div class="panel"><h2>支出结构 · 日常口径</h2><div id="categories"></div></div><div class="panel"><h2>最近交易</h2><div id="recent"></div></div></section></main><script>
const yuan=c=>`¥ ${(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2})}`;fetch('/api/overview?nature=%E6%97%A5%E5%B8%B8').then(r=>r.json()).then(d=>{const t=d.totals;document.querySelector('#cards').innerHTML=[['收入',t.income_cents,''],['支出',t.expense_cents,''],['结余',t.balance_cents,t.balance_cents<0?'negative':'income']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${x[2]}">${yuan(x[1])}</div><div class="muted">${x[0]==='结余'?'收入 − 支出':'2026 年 9 月累计'}</div></div>`).join('');const max=Math.max(...d.categories.map(x=>x.amount_cents));document.querySelector('#categories').innerHTML=d.categories.map(x=>`<div class="bar"><span>${x.category}</span><div class="track"><div class="fill" style="width:${x.amount_cents/max*100}%"></div></div><span class="amount">${yuan(x.amount_cents)}</span></div>`).join('');document.querySelector('#recent').innerHTML=d.recent.slice(0,6).map(x=>`<div class="tx"><span>${x.category}<small>${x.occurred_at.slice(5,10)} · ${x.category_group}</small></span><b class="${x.direction==='收入'?'income':''}">${x.direction==='收入'?'+':'−'}${yuan(x.amount_cents)}</b></div>`).join('')})
</script></body></html>
