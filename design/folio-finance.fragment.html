<div id="folio-finance" aria-label="个人财务 Web 应用设计">
<style>
#folio-finance{--f-bg:light-dark(#f5f5f7,#161618);--f-panel:light-dark(#fff,#222225);--f-ink:light-dark(#1d1d1f,#f5f5f7);--f-muted:light-dark(#75757c,#a5a5ae);--f-line:light-dark(#eaeaec,#363639);--f-side:light-dark(#eeeef1,#1d1d20);--f-blue:#007aff;--f-soft:light-dark(#e5efff,#243951);--f-green:light-dark(#258454,#6ad39c);--f-track:light-dark(#ededf0,#39393d);color:var(--f-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:var(--f-bg);border-radius:20px;overflow:hidden;min-height:820px;font-weight:400}
#folio-finance *{box-sizing:border-box}#folio-finance button{font:inherit;color:inherit;cursor:pointer}#folio-finance button:focus-visible{outline:3px solid var(--f-blue);outline-offset:3px}#folio-finance .f-shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:820px}#folio-finance .f-sidebar{background:var(--f-side);padding:30px 14px;display:flex;flex-direction:column;border-right:1px solid var(--f-line)}#folio-finance .f-logo{font-size:23px;font-weight:600;letter-spacing:-1px;display:flex;align-items:center;gap:9px;padding:0 10px 36px}#folio-finance .f-logo i{color:var(--f-blue)}#folio-finance .f-navlabel{font-size:11px;color:var(--f-muted);padding:0 12px 9px;letter-spacing:1.4px}#folio-finance .f-nav{display:flex;flex-direction:column;gap:5px}#folio-finance .f-nav button{border:0;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;border-radius:10px;font-size:13px}#folio-finance .f-nav button[aria-pressed=true]{background:var(--f-panel);box-shadow:0 2px 6px #00000005;color:var(--f-blue);font-weight:500}#folio-finance svg.lucide{width:18px;height:18px;stroke-width:1.7}#folio-finance .f-sidebottom{margin-top:auto;padding:24px 10px 0;color:var(--f-muted);font-size:11px}#folio-finance .f-profile{display:flex;align-items:center;gap:10px;padding-bottom:18px;margin-bottom:15px;border-bottom:1px solid var(--f-line);color:var(--f-ink);font-size:12px}#folio-finance .f-avatar{height:32px;width:32px;border-radius:50%;background:var(--f-panel);display:grid;place-items:center;font-weight:500}#folio-finance .f-main{padding:0 30px 26px;min-width:0}#folio-finance .f-top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--f-line);font-size:11px;color:var(--f-muted)}#folio-finance .f-topright{display:flex;align-items:center;gap:13px}#folio-finance .f-iconbtn{border:0;background:transparent;display:flex;padding:5px;color:var(--f-muted)}#folio-finance .f-dot{height:5px;width:5px;border-radius:50%;background:var(--f-green);display:inline-block;margin-right:6px}#folio-finance .f-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:27px 0 23px}#folio-finance h1{font-size:27px;line-height:1.25;letter-spacing:-1px;margin:0 0 7px;font-weight:600}#folio-finance .f-sub{color:var(--f-muted);font-size:12px}#folio-finance .f-segment{padding:3px;background:var(--f-track);border-radius:9px;display:flex;flex-shrink:0;gap:2px}#folio-finance .f-segment button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:11px;color:var(--f-muted)}#folio-finance .f-segment button[aria-pressed=true]{background:var(--f-panel);color:var(--f-ink);box-shadow:0 1px 4px #00000012}#folio-finance .f-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:18px}#folio-finance .f-stat{background:var(--f-panel);border-radius:16px;padding:19px 19px 17px}#folio-finance .f-label{font-size:11px;color:var(--f-muted);display:flex;align-items:center;gap:6px}#folio-finance .f-num{font-size:27px;line-height:1.25;letter-spacing:-.8px;font-weight:500;font-variant-numeric:tabular-nums;margin:10px 0 8px;white-space:nowrap}#folio-finance .f-num small{font-size:15px;margin-right:4px;font-weight:400;color:var(--f-muted)}#folio-finance .f-caption{font-size:10px;color:var(--f-muted)}#folio-finance .f-positive{color:var(--f-green)}#folio-finance .f-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:18px}#folio-finance .f-panel{background:var(--f-panel);border-radius:16px;padding:21px;min-width:0}#folio-finance .f-panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}#folio-finance h2{font-size:14px;font-weight:500;margin:0}#folio-finance .f-link{border:0;background:transparent;color:var(--f-blue);font-size:11px;padding:3px 0;display:flex;align-items:center;gap:2px}#folio-finance .f-legend{display:flex;gap:12px;color:var(--f-muted);font-size:10px}#folio-finance .f-legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--f-blue);margin-right:5px}#folio-finance .f-legend span+span:before{background:#afc9ed}#folio-finance .f-chart{width:100%;display:block;overflow:visible}#folio-finance .f-chart text{fill:var(--f-muted);font-family:inherit;font-size:11px}#folio-finance .f-chart .f-gridline{stroke:var(--f-line);stroke-width:1}#folio-finance .f-insight{border-top:1px solid var(--f-line);padding-top:14px;margin-top:12px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--f-muted)}#folio-finance .f-insight i{color:var(--f-blue);flex-shrink:0}#folio-finance .f-rank{margin:18px 0}#folio-finance .f-rankline{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;gap:8px}#folio-finance .f-rankline b{font-weight:500;font-variant-numeric:tabular-nums}#folio-finance .f-track{height:6px;border-radius:5px;background:var(--f-track);overflow:hidden}#folio-finance .f-fill{height:100%;border-radius:5px;background:var(--f-blue)}#folio-finance .f-rank button{display:block;text-align:left;border:0;background:transparent;width:100%;padding:0}#folio-finance .f-bottom{margin-top:18px}#folio-finance .f-table{width:100%;border-collapse:collapse;font-size:11px}#folio-finance .f-table th{font-weight:400;color:var(--f-muted);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--f-line)}#folio-finance .f-table td{padding:13px 0;border-bottom:1px solid var(--f-line)}#folio-finance .f-table tr:last-child td{border-bottom:0;padding-bottom:0}#folio-finance .f-table th:last-child,#folio-finance .f-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}#folio-finance .f-merchant{display:flex;gap:10px;align-items:center}#folio-finance .f-merchanticon{display:grid;place-items:center;background:var(--f-bg);height:30px;width:30px;border-radius:9px;color:var(--f-muted)}#folio-finance .f-merchant small{display:block;color:var(--f-muted);font-size:10px;margin-top:2px}#folio-finance .f-footer{display:flex;justify-content:space-between;color:var(--f-muted);font-size:10px;padding-top:18px}#folio-finance .f-bigvalue{font-size:35px;font-weight:500;letter-spacing:-1px;margin:2px 0 4px}#folio-finance .f-stack{display:flex;height:15px;border-radius:5px;overflow:hidden;gap:3px;margin:22px 0}#folio-finance .f-stack span{background:var(--f-blue)}#folio-finance .f-note{padding:14px;border-radius:10px;background:var(--f-bg);font-size:11px;color:var(--f-muted);margin-top:19px}#folio-finance .f-note strong{display:block;color:var(--f-ink);font-weight:500;margin-bottom:5px}#folio-finance .f-drawer{margin-top:18px;border:1px solid var(--f-line);border-radius:12px;padding:15px;background:var(--f-bg)}#folio-finance [hidden]{display:none!important}#folio-finance .f-compact .f-panel{padding:16px}#folio-finance .f-compact .f-stat{padding:15px}
@media(min-width:1200px){#folio-finance .f-main{padding-left:44px;padding-right:44px}#folio-finance .f-num{font-size:32px}}
@media(max-width:850px){#folio-finance .f-shell{grid-template-columns:145px minmax(0,1fr)}#folio-finance .f-sidebar{padding:27px 9px}#folio-finance .f-main{padding:0 20px 24px}#folio-finance .f-num{font-size:23px}#folio-finance .f-grid{grid-template-columns:minmax(0,1fr)}#folio-finance .f-stats{gap:9px}#folio-finance .f-stat{padding:16px 12px}#folio-finance .f-heading{align-items:flex-start}#folio-finance .f-ranks{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}}
@media(max-width:560px){#folio-finance{border-radius:12px}#folio-finance .f-shell{display:block}#folio-finance .f-sidebar{padding:16px 15px 10px;border:0;border-bottom:1px solid var(--f-line)}#folio-finance .f-logo{padding:0 0 13px;font-size:20px}#folio-finance .f-nav{flex-direction:row;gap:3px}#folio-finance .f-nav button{padding:9px 10px;font-size:11px;gap:6px;flex:1;justify-content:center}#folio-finance .f-navlabel,#folio-finance .f-sidebottom{display:none}#folio-finance .f-main{padding:0 15px 20px}#folio-finance .f-top{height:44px}#folio-finance .f-topright>span{display:none}#folio-finance .f-heading{padding:22px 0 18px;flex-wrap:wrap}#folio-finance h1{font-size:25px}#folio-finance .f-stats{grid-template-columns:1fr 1fr}#folio-finance .f-stat:first-child{grid-column:1/-1}#folio-finance .f-stat:first-child .f-num{font-size:33px}#folio-finance .f-stat{padding:16px}#folio-finance .f-num{font-size:22px}#folio-finance .f-panel{padding:17px}#folio-finance .f-ranks{display:block}#folio-finance .f-accountcol{display:none}#folio-finance .f-caption{font-size:11px}#folio-finance .f-footer{gap:10px}}
</style>
<div class="f-shell"><aside class="f-sidebar"><div class="f-logo"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>澄明<span style="font-size:10px;letter-spacing:1px;color:var(--f-muted);align-self:end;padding-bottom:4px">FOLIO</span></div><div class="f-navlabel">个人财务</div><nav class="f-nav" aria-label="主要导航"><button data-page="overview" aria-pressed="true"><i data-lucide="layout-grid" aria-hidden="true"></i>财务总览</button><button data-page="spending" aria-pressed="false"><i data-lucide="chart-no-axes-column" aria-hidden="true"></i>收支分析</button><button data-page="invest" aria-pressed="false"><i data-lucide="chart-line" aria-hidden="true"></i>投资表现</button></nav><div class="f-sidebottom"><div class="f-profile"><div class="f-avatar">林</div><div>我的个人账本<div class="f-caption">人民币 · CNY</div></div></div><i data-lucide="lock-keyhole" aria-hidden="true"></i><div style="margin-top:7px">看清每一笔，安心每一天。</div></div></aside><main class="f-main"><div class="f-top"><span>我的账本 <span style="padding:0 9px">/</span><span id="f-breadcrumb">财务总览</span></span><div class="f-topright"><span><span class="f-dot"></span>示例账本</span><button class="f-iconbtn" id="f-privacy" aria-label="隐藏金额" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button></div></div><div class="f-heading"><div><h1 id="f-title">让财务，清晰一点。</h1><div class="f-sub" id="f-subtitle">2026 年 9 月 · 每一份积累，都值得被看见。</div></div><div class="f-segment" aria-label="统计周期"><button data-period="month" aria-pressed="true">本月</button><button data-period="year" aria-pressed="false">今年</button></div></div><div id="f-content" aria-live="polite"></div><footer class="f-footer"><span>澄明 Folio · 个人财务分析</span><span>设计预览 · 数据仅作演示</span></footer></main></div>
<script>
(()=>{const root=document.getElementById('folio-finance');const content=root.querySelector('#f-content');let page='overview',period='month',privacy=false,kind='expense';const fmt=n=>privacy?'••••••':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const monthly={inc:18500,out:9860.73,save:8639.27};const annual={inc:165591.91,out:121692.57,save:43899.34};const cats=[['住房',5879.73,61396.47],['餐饮',1486,12936.96],['购物',1120,14624.35],['交通',640,7173],['其他',735,25561.79]];const incomes=[['工资',14500,91768.53],['投资收益',2500,17582.38],['其他收入',1500,56241]];const names={overview:'财务总览',spending:'收支分析',invest:'投资表现'};
const chartObserver=new ResizeObserver(entries=>entries.forEach(({target,contentRect})=>{target.querySelectorAll('text').forEach(t=>t.style.fontSize=(11*500/Math.max(contentRect.width,200))+'px')}));function icons(){root.querySelectorAll('.f-chart').forEach(c=>chartObserver.observe(c));if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})}
function stat(label,num,caption){return `<div class="f-stat"><div class="f-label">${label}</div><div class="f-num"><small>¥</small>${fmt(num)}</div><div class="f-caption">${caption}</div></div>`}
function trend(invest=false){const w=500,h=207;let s=`<svg class="f-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${invest?'累计投资收益趋势，单位元':'月度收入与支出对比，单位万元'}">`;const ticks=invest?['3,000','2,000','1,000','0']:['6万','4万','2万','0'];for(let j=0;j<4;j++){const y=18+j*49;s+=`<line class="f-gridline" x1="42" y1="${y}" x2="491" y2="${y}"/><text x="0" y="${y+4}">${ticks[j]}</text>`}if(invest){const vals=period==='year'?[0,450,220,880,510,1220,1010,1680,1460,2170,2450,2432.02]:[0,160,150,690,610,470,1290,1100,1640,1850,1710,2432.02];let p=vals.map((v,i)=>`${42+i*40.8},${165-v/3000*147}`).join(' ');s+=`<polygon points="42,165 ${p} 491,165" fill="var(--f-blue)" opacity=".07"/><polyline points="${p}" fill="none" stroke="var(--f-blue)" stroke-width="2.7" stroke-linejoin="round"/><circle cx="491" cy="${165-2432.02/3000*147}" r="4" fill="var(--f-blue)"/>`;['1日','7日','14日','21日','30日'].forEach((t,i)=>s+=`<text x="${42+i*112}" y="192" text-anchor="${i===4?'end':i===0?'start':'middle'}">${period==='year'?['1月','3月','5月','7月','9月'][i]:t}</text>`)}else{const a=[12200,39300,14000,11900,34200,11900,9800,13791.91,18500];const b=[14800,24500,14300,16700,11100,12000,10000,8431.84,9860.73];for(let i=0;i<9;i++){let x=51+i*50;let v1=a[i]/60000*147,v2=b[i]/60000*147;s+=`<rect x="${x}" y="${165-v1}" width="12" height="${v1}" rx="3" fill="var(--f-blue)"/><rect x="${x+15}" y="${165-v2}" width="12" height="${v2}" rx="3" fill="#afc9ed"/><text x="${x+13}" y="192" text-anchor="middle">${i+1}月</text>`}}return s+'</svg>'}
function ranks(arr,total,interactive=true){return `<div class="f-ranks">${arr.map((r,i)=>{let v=r[period==='month'?1:2];return `<div class="f-rank"><button ${interactive?`data-category="${r[0]}" aria-label="查看${r[0]}明细"`:'disabled style="cursor:default"'}><div class="f-rankline"><span><span style="color:var(--f-muted);margin-right:10px">0${i+1}</span>${r[0]}</span><b>${fmt(v)} <span style="color:var(--f-muted);font-size:10px;margin-left:5px">${(v/total*100).toFixed(1)}%</span></b></div><div class="f-track"><div class="f-fill" style="width:${v/total*100}%;opacity:${1-i*.14}"></div></div></button></div>`}).join('')}</div>`}
function transactions(invest=false){let rows=invest?[['arrow-up-right','投资收益','宽基指数基金','09 / 21','投资账户',1500],['arrow-up-right','基金分红','红利 ETF','09 / 18','投资账户',932.02]]:[['house','住房租金','居住 · 固定支出','09 / 20','招商银行',-5800],['utensils','周末晚餐','餐饮 · 日常消费','09 / 19','微信支付',-186],['briefcase-business','工资收入','工作 · 工资','09 / 15','招商银行',14500]];return `<section class="f-panel f-bottom"><div class="f-panelhead"><h2>${invest?'最近投资记录':'最近收支'}</h2><span class="f-caption">2026 年 9 月</span></div><table class="f-table"><thead><tr><th>交易</th><th>日期</th><th class="f-accountcol">账户</th><th>金额 / 元</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="f-merchant"><span class="f-merchanticon"><i data-lucide="${r[0]}" aria-hidden="true"></i></span><span>${r[1]}<small>${r[2]}</small></span></div></td><td style="color:var(--f-muted)">${r[3]}</td><td class="f-accountcol" style="color:var(--f-muted)">${r[4]}</td><td style="color:${r[5]>0?'var(--f-green)':'var(--f-ink)'}">${privacy?'••••••':(r[5]>0?'+':'−')+fmt(Math.abs(r[5]))}</td></tr>`).join('')}</tbody></table></section>`}
function render(){const d=period==='month'?monthly:annual;root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));root.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.period===period));root.querySelector('#f-breadcrumb').textContent=names[page];root.querySelector('#f-title').textContent=page==='overview'?'让财务，清晰一点。':page==='spending'?'每一笔，都有迹可循。':'让时间，见证积累。';root.querySelector('#f-subtitle').textContent=(period==='month'?'2026 年 9 月':'2026 年 · 截至 9 月 21 日')+' · '+(page==='overview'?'你的财务生活，一目了然。':page==='spending'?'理解收支结构，找到自己的节奏。':'关注长期表现，也看见每一次变化。');if(page==='overview'){content.innerHTML=`<div class="f-stats">${stat('结余',d.save,'<span class="f-positive">收入 − 支出</span> · 本期净积累')}${stat('收入',d.inc,'工资、分红及其他收入')}${stat('支出',d.out,'生活消费与其他支出')}</div><div class="f-grid"><section class="f-panel"><div class="f-panelhead"><h2>收支趋势</h2><div class="f-legend"><span>收入</span><span>支出</span></div></div>${trend()}<div class="f-insight"><i data-lucide="sparkles" aria-hidden="true"></i>本期结余占收入的 ${(d.save/d.inc*100).toFixed(1)}%，为未来多留一份余地。</div></section><section class="f-panel"><div class="f-panelhead"><h2>钱花在哪里</h2><button class="f-link" data-go="spending">查看分析 <i data-lucide="chevron-right" aria-hidden="true"></i></button></div>${ranks(cats.slice(0,4),d.out)}<div class="f-caption">其他支出 ¥ ${fmt(cats[4][period==='month'?1:2])}</div></section></div>${transactions()}`}
else if(page==='spending'){const arr=kind==='expense'?cats:incomes,total=kind==='expense'?d.out:d.inc;content.innerHTML=`<div class="f-stats">${stat('收入',d.inc,'本期累计收入')}${stat('支出',d.out,'本期累计支出')}${stat('结余',d.save,`结余率 ${(d.save/d.inc*100).toFixed(1)}%`)}</div><div class="f-grid"><section class="f-panel"><div class="f-panelhead"><h2>收支构成</h2><div class="f-segment" aria-label="收支类型"><button data-kind="expense" aria-pressed="${kind==='expense'}">支出</button><button data-kind="income" aria-pressed="${kind==='income'}">收入</button></div></div><div class="f-label">${kind==='expense'?'总支出':'总收入'} · 人民币</div><div class="f-bigvalue">${fmt(total)}</div><div class="f-stack" role="img" aria-label="各类别占比">${arr.map((r,i)=>`<span style="width:${r[period==='month'?1:2]/total*100}%;opacity:${1-i*.14}"></span>`).join('')}</div>${ranks(arr,total)}<div class="f-caption">选择类别查看明细</div><div id="f-detail" class="f-drawer" hidden></div></section><section class="f-panel"><div class="f-panelhead"><h2>本期观察</h2><i data-lucide="sparkles" aria-hidden="true" style="color:var(--f-blue)"></i></div><div class="f-label">${arr[0][0]}占${kind==='expense'?'支出':'收入'}</div><div class="f-bigvalue">${(arr[0][period==='month'?1:2]/total*100).toFixed(1)}<span style="font-size:19px;color:var(--f-muted)">%</span></div><div class="f-sub">这是你本期最大的${kind==='expense'?'支出类别':'收入来源'}。</div><div class="f-note"><strong>${kind==='expense'?'先看固定支出，再看弹性空间。':'看清来源，也看清稳定性。'}</strong>${kind==='expense'?'将住房等固定成本单独观察，能更清楚地理解日常消费变化。':'将工资与投资收入分开观察，有助于理解每个月可持续的结余。'}</div><div class="f-note"><strong>统计口径</strong>本页按现金收支统计；账户间转账不计入收入或支出。</div></section></div>`}
else{content.innerHTML=`<div class="f-stats">${stat('累计收益',2432.02,'<span class="f-positive">已实现收益 + 持仓浮动收益</span>')}${stat('当前持仓市值',80912.16,'成本 ¥ '+fmt(80000))}${stat('已实现收益',1519.86,'卖出收益与现金分红')}</div><div class="f-grid"><section class="f-panel"><div class="f-panelhead"><h2>累计收益走势</h2><span class="f-caption">人民币 / 元</span></div>${trend(true)}<div class="f-insight"><i data-lucide="chart-line" aria-hidden="true"></i>区间累计收益 ¥ ${fmt(2432.02)} · 含已实现与浮动收益</div></section><section class="f-panel"><div class="f-panelhead"><h2>持仓分布</h2><span class="f-caption">按市值</span></div>${ranks([['宽基指数',40456.08,40456.08],['债券基金',24273.65,24273.65],['红利策略',16182.43,16182.43]],80912.16,false)}<div class="f-note"><strong>长期视角</strong>将持仓结构与收益一起观察，让波动有迹可循。</div></section></div>${transactions(true)}`};icons()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.go){page=b.dataset.go;render()}if(b.dataset.period){period=b.dataset.period;render()}if(b.dataset.kind){kind=b.dataset.kind;render()}if(b.id==='f-privacy'){privacy=!privacy;b.setAttribute('aria-pressed',privacy);b.setAttribute('aria-label',privacy?'显示金额':'隐藏金额');b.innerHTML=`<i data-lucide="${privacy?'eye-off':'eye'}" aria-hidden="true"></i>`;render()}if(b.dataset.category){if(page!=='spending'){page='spending';render()}const detail=root.querySelector('#f-detail');if(detail){const arr=kind==='expense'?cats:incomes;const r=arr.find(r=>r[0]===b.dataset.category);if(r){detail.hidden=false;detail.innerHTML=`<div class="f-panelhead" style="margin:0 0 8px"><h2>${r[0]} · 类别详情</h2><button class="f-link" data-close="true">收起</button></div><div class="f-sub">${period==='month'?'2026 年 9 月':'2026 年至今'}累计${kind==='expense'?'支出':'收入'}</div><div style="font-size:24px;margin-top:5px">¥ ${fmt(r[period==='month'?1:2])}</div>`}}}if(b.dataset.close)root.querySelector('#f-detail').hidden=true});render();
const design={radius:16,density:'舒展',accent:'#007aff'};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--f-blue',design.accent);root.classList.toggle('f-compact',design.density==='紧凑');root.querySelectorAll('.f-panel,.f-stat').forEach(p=>p.style.borderRadius=design.radius+'px')}});t.addSelect(design,'density',{label:'信息密度',options:['舒展','紧凑']});t.addSlider(design,'radius',{label:'卡片圆角',min:8,max:24,unit:'px'});t.addColorPicker(design,'accent',{label:'强调色'})}
})();
</script>
</div>
